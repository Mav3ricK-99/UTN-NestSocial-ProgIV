<div routerLink="/profile/{{ user().getUserName() }}"
    class="user-card group relative flex w-64 cursor-pointer flex-col items-center gap-3 overflow-hidden rounded-2xl bg-white px-5 pb-5 pt-12 text-center shadow-md ring-1 ring-slate-200 transition-all duration-200 hover:-translate-y-1 hover:shadow-xl"
    [class.user-card-disabled]="!user().getEnabled()">

    <!-- Banner superior segun rol -->
    <div class="absolute inset-x-0 top-0 h-20"
        [class]="user().isAdmin() ? 'bg-linear-to-br from-amber-400 to-orange-500' : 'bg-linear-to-br from-slate-600 to-slate-800'">
    </div>

    <!-- Switch de habilitacion (solo admin, no sobre su propia card) -->
    @if(!isOwnCard()) {
    <form *appHasRole="'ADMIN'" [formGroup]="activateUserForm"
        class="absolute right-3 top-3 flex items-center gap-2 rounded-full bg-black/30 px-2 py-1 backdrop-blur-sm"
        (click)="$event.stopPropagation()">
        <span class="text-[10px] font-medium uppercase tracking-wide text-white">
            {{ user().getEnabled() ? 'Activo' : 'Inactivo' }}
        </span>
        <p-checkbox (click)="setUserDisable(); $event.stopPropagation()" formControlName="enabled" [binary]="true" />
    </form>
    }

    <img [appLazyImage]="user().getAvatarPathUrl()" fallbackSrc="/default-avatar.jfif" alt="avatar"
        class="relative size-16 shrink-0 rounded-full bg-slate-200 object-cover ring-4 ring-white" />

    <div class="flex w-full flex-col items-center gap-0.5">
        <div class="w-full truncate text-base font-semibold text-slate-800" [title]="user().userFullName">
            {{ user().userFullName }}
        </div>
        <div class="w-full truncate text-sm text-slate-500">
            &#64;{{ user().username }}
        </div>
    </div>

    <!-- Rol -->
    <span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-semibold"
        [class]="user().isAdmin() ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'">
        <i class="pi" [class]="user().isAdmin() ? 'pi-shield' : 'pi-user'"></i>
        {{ user().isAdmin() ? 'Administrador' : 'Usuario' }}
    </span>

    <div class="mt-1 flex w-full flex-col gap-1.5 border-t border-slate-100 pt-3 text-xs text-slate-500">
        <div class="flex items-center justify-center gap-2 truncate" [title]="user().getEmail()">
            <i class="pi pi-envelope text-slate-400"></i>
            <span class="truncate">{{ user().getEmail() }}</span>
        </div>
        @if(user().getCreatedAt()) {
        <div class="flex items-center justify-center gap-2">
            <i class="pi pi-calendar text-slate-400"></i>
            <span>Miembro desde {{ user().getCreatedAt() | date: 'dd/MM/yyyy' }}</span>
        </div>
        }
    </div>

</div>
